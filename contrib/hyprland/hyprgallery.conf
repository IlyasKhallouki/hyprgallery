# hyprgallery for Hyprland. Source this from hyprland.conf, or copy the lines
# you want. Rule syntax is Hyprland 0.53 and later; see the README for older
# releases.

# hyprgallery animates its own opening and closing. Hyprland's layer animation
# on top of that makes the gallery arrive twice.
layerrule = no_anim true,match:namespace hyprgallery

# Blur behind the popover panel. ignore_alpha keeps the transparent area
# around the panel from being blurred as well.
layerrule = blur true,match:namespace hyprgallery
layerrule = ignore_alpha 0.5,match:namespace hyprgallery

# Optional: start the daemon at login, so thumbnails are ready before the first
# click. Without this, the Waybar module or the first command starts it.
# exec-once = hyprgallery daemon

# Optional: a key for it. Pick one your config does not already use.
# bind = SUPER ALT, W, exec, hyprgallery toggle
