[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# gtk4 0.11 requires 1.92, so that is the real floor for a default build.
rust-version = "1.92"
license = "MIT"
authors = ["Ilyas Khallouki <khalloukielias@gmail.com>"]
repository = "https://github.com/IlyasKhallouki/hyprgallery"
homepage = "https://github.com/IlyasKhallouki/hyprgallery"
keywords = ["wallpaper", "hyprland", "waybar", "wayland", "gtk4"]
categories = ["gui", "multimedia::images"]

[workspace.dependencies]
hyprgallery-core = { path = "crates/hyprgallery-core", version = "0.1.0" }
hyprgallery-ui = { path = "crates/hyprgallery-ui", version = "0.1.0" }

anyhow = "1"
async-channel = "2"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
fast_image_resize = "6"
# v4_12 for CssProvider::load_from_string, which is what makes swapping the
# accent colour and hot-reloading the user stylesheet cheap.
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
# Pure Rust decoders only, so there is no C toolchain dependency beyond GTK.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
# Kept alongside `image` for one reason: it can decode a JPEG at 1/2, 1/4 or
# 1/8 scale inside the IDCT. A 20 megapixel photo thumbnailed that way costs a
# sixty-fourth of the work and memory of a full decode.
jpeg-decoder = { version = "0.3", default-features = false }
libc = "0.2"
notify = "8"
nucleo-matcher = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# Full debug info for a GTK workspace runs to gigabytes. Line tables are enough
# for backtraces and keep the build off the swap.
debug = "line-tables-only"

[profile.dev.package."*"]
# Decoding and resizing are unusably slow unoptimised, which would make the
# debug build lie about how the app feels.
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
